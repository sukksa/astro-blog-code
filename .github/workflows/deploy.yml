name: Deploy to GitHub Pages

# 源码在本仓库（astro-blog-code），只把构建产物推送到 sukksa/sukksa.github.io 的 master。
# 目标仓库的 Pages 发布会读取 master，因此不需要在那里放任何源码或工作流。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm run build

      # GitHub Pages 默认走 Jekyll，_astro/ 这类下划线目录会被忽略
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy to sukksa.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 该密钥是 sukksa/sukksa.github.io 上的部署密钥（只对该仓库有写权限）
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: sukksa/sukksa.github.io
          publish_branch: master
          publish_dir: ./dist
          # 每次只保留一个“当前产物”提交，避免产物历史越滚越大
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "chore: deploy astro-blog-code@${{ github.sha }}"
